name: STM32 Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 261107_prj_1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain and STM32 target
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target thumbv7em-none-eabihf

      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.99.1 clippy --locked

      - name: Build firmware
        run: cargo +1.99.1 build --locked
